name: Scheduled Push
on:
  schedule:
    - cron: '*/10 * * * *'  # Runs every 10 minutes

jobs:
  auto-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v2
      - name: Push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Automated commit" || echo "No changes to commit"
          git push